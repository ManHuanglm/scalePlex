[PLU_STATUS1]
#######################################################################
#PLU_Status1_Byte1
#BIT0_UNIT:                         0--Weighing,1--Non-weighing
#BIT1_UNIT_PRICE:                   0--1ST_Price,1--2ND_Price
#BIT2_SELL_BY_DATE:                 0--INHIBIT,1--ALLOW
#BIT3_USED_BY_DATE:                 0--INHIBIT,1--ALLOW
#BIT4_PACKED_DATE:                  0--INHIBIT,1--ALLOW
#BIT5_SELL_BY_TIME:                 0--INHIBIT,1--ALLOW
#BIT6_PACKED_TIME:                  0--INHIBIT,1--ALLOW
#BIT7_RTC_PACKED_TIME:              0--RTC,1--KEY_ENTRY
#######################################################################
UNIT=0
UNIT_PRICE=0
SELL_BY_DATE=1
USED_BY_DATE=1
PACKED_DATE=1
SELL_BY_TIME=1
PACKED_TIME=1
RTC_PACKED_TIME=0

########################################################################
#PLU_Status1_Byte2
#BIT0_RTC_SELL_BY_TIME:             0--RTC,1--KEY_ENTRY
#BIT1_PRICE_BASED_PER_UNIT:         0--Price_base_per_KG,1--**Price_base_per_100G
#BIT2_FORCE_SHELF_LIFE:             0--INHIBIT,1--ALLOW
#BIT3_NUTRITION_PRINT:              0--INHIBIT,1--ALLOW
#BIT4_UNIT_PRICE_OVERRIDE:          0--INHIBIT,1--ALLOW
#BIT5_SELL_BY_DATE_SOURCE:          0--RTC_DATE,1--PACKED_DATE
#BIT6_SECURITY_TAG_ISSUE_CONDITION: 0--THRESHOLD,1--THIS_PLU
#BIT7_APPEND_PLU_DATA:              0--INHIBIT,1--ALLOW
#########################################################################
RTC_SELL_BY_TIME=0
PRICE_BASED_PER_UNIT=0
FORCE_SHELF_LIFE=0
NUTRITION_PRINT=0
UNIT_PRICE_OVERRIDE=0
SELL_BY_DATE_SOURCE=0
SECURITY_TAG_ISSUE_CONDITION=0
APPEND_PLU_DATA=0

[PLU_STATUS2]
#########################################################################
#PLU_Status2_Byte1
#BIT0 LABEL_1_FORMAT:               0--DEFAULT,1--INDIVIDUAL
#BIT1 LABEL_2_FORMAT:               0--INHIBIT,1--ALLOW
#BIT2 BARCODE_FORMAT:               0--DEFAULT,1--INDIVIDUAL
#BIT3 ITEM_CODE:                    0--INHIBIT,1--ALLOW
#BIT4 MAIN_GROUP_CODE:              0--MG_CODE=997,1--MG_CODE<>997
#BIT5 COST:                         0--INHIBIT,1--ALLOW
#BIT6 PLU_TARE:                     0--INHIBIT,1--ALLOW
#BIT7 QUANTITY:                     0--INHIBIT,1--ALLOW
#########################################################################
LABEL1_FORMAT=1
LABEL2_FORMAT=1
BARCODE_FORMAT=1
ITEM_CODE=1
MAIN_GROUP_CODE=1
COST=1
PLU_TARE=1
QUANTITY=1

#########################################################################
#PLU_Status2_Byte2
#BIT0 QUANTITY_SYMBOL:              0--INHIBIT,1--ALLOW
#BIT1 SPECIAL_MESSAGE_No:           0--INHIBIT,1--ALLOW
#BIT2 INGREDIENT_No:                0--INHIBIT,1--ALLOW
#BIT3 DISCOUNT:                     0--INHIBIT,1--ALLOW
#BIT4 NUTRITION                     0--NO_NUTRI._DATA,1--WITH_NUTRI_DATA
#BIT5 COMMODITY                     0--INHIBIT,1--ALLOW
#BIT6 SPECIAL_MESSAGE:              0--INHIBIT,1--ALLOW
#BIT7 INGREDIENT:                   0--INHIBIT,1--ALLOW
##########################################################################
QUANTITY_SYMBOL=1
SPECIAL_MESSAGE_No=1
INGREDIENT_No=1
DISCOUNT=0
NUTRITION=0
COMMODITY=1
SPECIAL_MESSAGE=1
INGREDIENT=1

##########################################################################
#PLU_Status2_Byte3
#BIT0 SELL_BY_DATE:                 0--INHIBIT,1--ALLOW
#BIT1 SELL_BY_TIME:                 0--INHIBIT,1--ALLOW
#BIT2 USED_BY_DATE:                 0--INHIBIT,1--ALLOW
#BIT3 PACKED_DATE:                  0--INHIBIT,1--ALLOW
#BIT4 PACKED_TIME:                  0--INHIBIT,1--ALLOW
#BIT5 PLACE_NUMBER:                 0--INHIBIT,1--ALLOW
#BIT6 IMAGE_NUMBER:                 0--INHIBIT,1--ALLOW
#BIT7 PLU_STATUSB_and_PLU_STATUS_2B:0--INHIBIT,1--ALLOW
#########################################################################
SELL_BY_DATE=1
SELL_BY_TIME=1
USED_BY_DATE=1
PACKED_DATE=1
PACKED_TIME=1
PLACE_NUMBER=1
IMAGE_NUMBER=0
PLUSTATUSB_and_PLUSTATUS2B=0

